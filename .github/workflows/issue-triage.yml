name: Codex Issue triage

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Existing Issue number to analyze
        required: true
        type: number

concurrency:
  group: codex-issue-triage-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analyze:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name != 'issue_comment' ||
        (!github.event.issue.pull_request &&
         github.actor == 'MddIdd' &&
         github.event.comment.body == '/ai-triage'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
    outputs:
      should-publish: ${{ steps.gate.outputs.should-analyze }}
      attempt: ${{ steps.gate.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Collect public Issue context
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const issueNumber = context.issue.number || Number('${{ inputs.issue_number }}');
            if (!Number.isInteger(issueNumber) || issueNumber <= 0) {
              core.setFailed('A valid Issue number is required.');
              return;
            }
            const {data: issue} = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            if (issue.pull_request) {
              core.setFailed('Pull request comments are outside Issue triage scope.');
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const {data: recentByAuthor} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: issue.user.login,
              state: 'all',
              sort: 'updated',
              direction: 'desc',
              per_page: 20,
            });
            const relatedIssues = recentByAuthor.filter(candidate =>
              !candidate.pull_request && candidate.number !== issueNumber
            );
            fs.writeFileSync(
              '.github/codex/issue-context-raw.json',
              JSON.stringify({
                issue,
                comments,
                related_issues: relatedIssues,
                event: {
                  name: context.eventName,
                  action: context.payload.action || '',
                  actor: context.actor,
                  comment_body: context.payload.comment?.body || '',
                },
              }),
              {encoding: 'utf8', mode: 0o600},
            );

      - name: Authorize, limit, redact, and bound untrusted context
        id: gate
        run: |
          trap 'rm -f .github/codex/issue-context-raw.json' EXIT
          python .github/scripts/issue_triage.py prepare \
            --input .github/codex/issue-context-raw.json \
            --output .github/codex/issue-context.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Analyze Issue with Codex
        if: steps.gate.outputs.should-analyze == 'true'
        uses: openai/codex-action@f367b1e9572fd064ea71ef925ca24ee0f01080af # v1
        with:
          openai-api-key: ${{ secrets.API_KEY }}
          responses-api-endpoint: ${{ format('{0}/responses', secrets.BASE_URL) }}
          model: ${{ secrets.MODEL }}
          effort: medium
          prompt-file: .github/codex/issue-triage.md
          output-file: codex-issue-result.json
          output-schema-file: .github/codex/issue-triage.schema.json
          permission-profile: :read-only
          safety-strategy: drop-sudo
          # Public reporters may trigger the initial opened event. Every rerun has a
          # second action-level maintainer check in addition to the tested gate above.
          allow-users: ${{ github.event_name == 'issues' && '*' || 'MddIdd' }}
          codex-args: '["--ephemeral"]'

      - name: Validate and render bounded output
        if: steps.gate.outputs.should-analyze == 'true'
        run: |
          python .github/scripts/issue_triage.py render \
            --input codex-issue-result.json \
            --output-dir triage-output \
            --attempt '${{ steps.gate.outputs.attempt }}'

      - name: Upload validated triage output
        if: steps.gate.outputs.should-analyze == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: codex-issue-triage
          path: triage-output
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: analyze
    if: >-
      needs.analyze.result == 'success' &&
      needs.analyze.outputs.should-publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: codex-issue-triage
          path: triage-output

      - name: Publish analysis and managed labels
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- mdd-codex-issue-triage -->';
            const failureMarker = '<!-- mdd-codex-issue-triage-failure -->';
            const issueNumber = context.issue.number || Number('${{ inputs.issue_number }}');
            const body = fs.readFileSync('triage-output/comment.md', 'utf8');
            const labelPlan = JSON.parse(fs.readFileSync('triage-output/labels.json', 'utf8'));
            const selected = new Set(labelPlan.apply.map((label) => label.name));

            for (const label of labelPlan.apply) {
              try {
                await github.rest.issues.getLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: label.name,
                  color: label.color,
                  description: label.description,
                });
              }
            }

            const {data: issue} = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            const current = new Set(issue.labels.map((label) => label.name));
            for (const name of labelPlan.managed) {
              if (current.has(name) && !selected.has(name)) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                  name,
                });
              }
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              labels: [...selected],
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            const previousFailure = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(failureMarker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
            if (previousFailure) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: previousFailure.id,
              });
            }

  report-failure:
    needs: analyze
    if: needs.analyze.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Leave a bounded failure notice
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const marker = '<!-- mdd-codex-issue-triage-failure -->';
            const issueNumber = context.issue.number || Number('${{ inputs.issue_number }}');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const attempts = comments
              .filter((comment) => comment.user?.login === 'github-actions[bot]')
              .flatMap((comment) => {
                const match = comment.body?.match(
                  /<!-- mdd-codex-issue-triage-attempt:(\d+) -->/
                );
                return match ? [Number(match[1])] : [];
              });
            const attempt = Math.min(Math.max(0, ...attempts) + 1, 3);
            const attemptMarker = `<!-- mdd-codex-issue-triage-attempt:${attempt} -->`;
            const body = `${marker}\n${attemptMarker}\n## 自动分析暂时失败\n\n` +
              'Codex 分析服务当前不可用或返回了无效结果。维护者 `MddIdd` 需要人工查看；' +
              '本次失败不会执行代码、部署或其他仓库写入。';
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }
